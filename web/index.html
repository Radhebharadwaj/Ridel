  <style id="splash-screen-style">
    body {
      background-color: #161E28;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .logo-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      /* Shimmer mask over the entire row */
      -webkit-mask-image: linear-gradient(110deg, rgba(0, 0, 0, 0.4) 40%, rgba(0, 0, 0, 0.8) 50%, rgba(0, 0, 0, 0.4) 60%);
      -webkit-mask-size: 200% auto;
      mask-image: linear-gradient(110deg, rgba(0, 0, 0, 0.4) 40%, rgba(0, 0, 0, 0.8) 50%, rgba(0, 0, 0, 0.4) 60%);
      mask-size: 200% auto;
      animation: sweepMask 3.5s ease-in-out infinite;
    }
    .bike-svg {
      width: 38px;
      height: 38px;
      fill: #ffffff; /* Solid color for the mask to reveal */
    }
    .shimmer-text {
      color: #ffffff;
    }
    .maps-text {
      font-size: 28px;
      font-weight: 600;
      margin-left: 8px;
    }
    .beta-badge {
      margin-left: 12px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 4px 8px;
    }
    .beta-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }
    @keyframes sweepMask {
      0% { -webkit-mask-position: 200% center; mask-position: 200% center; }
      100% { -webkit-mask-position: -200% center; mask-position: -200% center; }
    }
    .loading-dots {
      margin-top: 40px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.4);
      animation: bounceDots 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounceDots {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("native-splash")?.remove();
      document.body.style.background = "transparent";
      document.body.style.display = "block";
    }
  </script>
