  <style>
    /* Neon Theme for Web Cropper */
    .cropper-crop-box {
      box-shadow: 0 0 10px cyan !important;
      outline: 2px solid cyan !important;
    }

    .cropper-view-box {
      outline: 1px solid cyan !important;
    }

    .cropper-point {
      background-color: cyan !important;
      width: 8px !important;
      height: 8px !important;
    }

    .cropper-line {
      background-color: transparent !important;
    }

    .cropper-modal {
      background-color: rgba(0, 0, 0, 0.85) !important;
      backdrop-filter: blur(5px);
    }

    .cropper-point.point-ne,
    .cropper-point.point-nw,
    .cropper-point.point-se,
    .cropper-point.point-sw {
      background-color: cyan !important;
    }

    .cropper-point.point-n,
    .cropper-point.point-s,
    .cropper-point.point-e,
    .cropper-point.point-w {
      display: none !important;
    }

    /* MAPLIBRE FIX 2: Force Map to take full height/width inside Flutter's canvas */
    .maplibregl-map {
      width: 100% !important;
      height: 100% !important;
    }

    .maplibregl-canvas {
      outline: none !important;
    }

    /* Force Hide Map Attribution & Buttons */
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-attrib {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>

  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      /* MAPLIBRE FIX 3: Changed to Dark Grey so we know if the map is actually rendering */
      background-color: #1E1E1E;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
