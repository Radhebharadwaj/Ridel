<html>
<head>

    <meta charset="UTF-8">

    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.css">
    
    <style>
      /* Neon Theme for Web Cropper */
      .cropper-crop-box {
        box-shadow: 0 0 10px cyan !important;
        outline: 2px solid cyan !important;
      }
      .cropper-view-box {
        outline: 1px solid cyan !important;
      }
      .cropper-point {
        background-color: cyan !important;
        width: 8px !important;
        height: 8px !important;
      }
      .cropper-line {
        background-color: transparent !important; /* Hide grid lines for cleaner look */
      }
      .cropper-modal {
        background-color: rgba(0, 0, 0, 0.85) !important; /* Glass dim effect */
        backdrop-filter: blur(5px);
      }
      .cropper-point.point-ne,
      .cropper-point.point-nw,
      .cropper-point.point-se,
      .cropper-point.point-sw {
        background-color: cyan !important;
      }
      .cropper-point.point-n,
      .cropper-point.point-s,
      .cropper-point.point-e,
      .cropper-point.point-w {
        display: none !important;
      }

      /* 1. OpenFreeMap Attribution Bar */
      .maplibregl-ctrl-attrib {
          display: none !important;
          opacity: 0 !important;
          visibility: hidden !important;
          height: 0 !important;
          width: 0 !important;
      }
      /* 🔥 FORCE HIDE MAP ATTRIBUTION & BUTTONS ON WEB */
      .maplibregl-ctrl-bottom-right {
          display: none !important;
      }
      .maplibregl-ctrl-attrib {
          display: none !important;
      }
    </style>
    
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

    <style id="splash-screen-style">
    html {
      height: 100%
    }
    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
      background-size: 100% 100%;
    }
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }
    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }
    .stretch {
      display:block;
      width:100%; height:100%;
    }
    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }
    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }
    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }
    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script src="flutter_bootstrap.js" async=""></script>
</body>
