<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delhi Metro - SVG God Mode Extractor</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif; padding-bottom: 80px; }
        #svg-container { width: 100vw; height: 100vh; overflow: auto; cursor: crosshair; }
        
        /* Map ke background ko dark rakhne ke liye */
        svg { background-color: #111; display: block; margin: 0 auto; }
        
        /* 🔥 Hover Magic: Jispe mouse jayega wo chamkega! */
        circle:hover, ellipse:hover, path:hover, text:hover, tspan:hover {
            stroke: #00FF00 !important;
            stroke-width: 8px !important;
            cursor: pointer;
            opacity: 0.8;
        }

        .controls {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.9); padding: 15px 25px; 
            border-radius: 12px; border: 2px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* 🔥 Updated Bottom Bar for 3 Sections */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.95); border-top: 3px solid #00FF00;
            padding: 10px; text-align: center; z-index: 1000;
            display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap;
        }

        .coord-group {
            display: flex; align-items: center; gap: 10px;
        }

        .coord-label {
            font-size: 18px; font-weight: bold; color: #ccc;
        }
        
        .output-box {
            background: #222; color: #00FF00; padding: 10px 15px;
            border-radius: 8px; font-family: monospace; font-size: 20px;
            text-align: center; border: 1px solid #555;
            box-shadow: inset 0 0 10px #000; transition: background 0.2s;
            min-width: 80px;
        }

        #out-xy { min-width: 280px; }
        
        /* 🔥 New Copy Button Style */
        .copy-btn { 
            background: #333; color: #fff; border: 1px solid #555; 
            padding: 8px 12px; font-size: 18px; border-radius: 5px; cursor: pointer; 
            transition: all 0.2s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        .copy-btn:hover { background: #00FF00; color: #000; border-color: #00FF00; transform: scale(1.05); }
        .copy-btn:active { transform: scale(0.95); }
        
        input[type="file"] { margin-top: 10px; color: white; }
    </style>
</head>
<body>

    <div class="controls">
        <h2 style="margin: 0 0 10px 0; color: #00FF00;">🚇 SVG Extractor</h2>
        <label><b>1. Select your 'delhi_map_clean.svg' file:</b></label><br>
        <input type="file" id="fileInput" accept=".svg">
        <p style="margin: 10px 0 0 0; font-size: 14px; color: #aaa;">Zoom: Ctrl + Mouse Wheel.<br>Hover & Click any Dot or Text!</p>
    </div>

    <div id="svg-container">
        <h3 style="text-align: center; margin-top: 20vh; color: #555;">Please select your SVG file from the top left corner to begin.</h3>
    </div>

    <div class="bottom-bar">
        <div class="coord-group">
            <span class="coord-label">X:</span>
            <div class="output-box" id="out-x">-</div>
            <button class="copy-btn" onclick="copyData('x')" title="Copy X Coordinate">📋</button>
        </div>
        
        <div class="coord-group">
            <span class="coord-label">Y:</span>
            <div class="output-box" id="out-y">-</div>
            <button class="copy-btn" onclick="copyData('y')" title="Copy Y Coordinate">📋</button>
        </div>

        <div class="coord-group">
            <span class="coord-label">XY Array:</span>
            <div class="output-box" id="out-xy">Waiting...</div>
            <button class="copy-btn" onclick="copyData('xy')" title="Copy Both as JSON">📋</button>
        </div>
    </div>

    <script>
        // Global variables coordinates store karne ke liye
        let currentX = "";
        let currentY = "";
        let currentXY = "";

        // 🔥 Copy Function (Direct 1-Click Copy)
        function copyData(type) {
            let textToCopy = "";
            let boxId = "";

            if (type === 'x') { textToCopy = currentX; boxId = 'out-x'; }
            else if (type === 'y') { textToCopy = currentY; boxId = 'out-y'; }
            else if (type === 'xy') { textToCopy = currentXY; boxId = 'out-xy'; }

            if (!textToCopy) return; // Agar click nahi hua hai toh copy mat karo

            navigator.clipboard.writeText(textToCopy).then(() => {
                // Flash effect dikhane ke liye jis box ka copy hua hai
                const box = document.getElementById(boxId);
                box.style.background = "#004400"; 
                setTimeout(() => { box.style.background = "#222"; }, 200);
            }).catch(err => {
                alert("Copy failed! Allow clipboard permissions.");
            });
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const svgContainer = document.getElementById('svg-container');
                svgContainer.innerHTML = e.target.result; // Put SVG directly in HTML

                const svgElement = svgContainer.querySelector('svg');
                if(svgElement) {
                    // Saare elements par click listener lagayenge
                    const elements = svgElement.querySelectorAll('*');
                    
                    elements.forEach(el => {
                        el.addEventListener('click', function(event) {
                            event.stopPropagation(); // Peeche wale background ko click hone se rokna
                            
                            const tag = el.tagName.toLowerCase();
                            // Faltu elements (groups) ko ignore karo
                            if (tag === 'g' || tag === 'svg' || tag === 'style' || tag === 'defs') return;

                            let cx = 0, cy = 0;

                            // 🎯 Agar Text hai toh uske exact x, y attributes utha lo
                            if (tag === 'text' || tag === 'tspan') {
                                const attrX = el.getAttribute('x');
                                const attrY = el.getAttribute('y');
                                if (attrX && attrY) {
                                    cx = parseFloat(attrX).toFixed(2);
                                    cy = parseFloat(attrY).toFixed(2);
                                } else {
                                    // Bounding Box fallback
                                    const bbox = el.getBBox();
                                    cx = bbox.x.toFixed(2);
                                    cy = bbox.y.toFixed(2);
                                }
                            } 
                            // 🎯 Agar Dot (circle/path/rect) hai toh uska exact Center Point utha lo
                            else {
                                // SVG ka getBBox() exact mathematical size aur position deta hai!
                                const bbox = el.getBBox();
                                cx = (bbox.x + bbox.width / 2).toFixed(2);
                                cy = (bbox.y + bbox.height / 2).toFixed(2);
                            }

                            // Update global variables
                            currentX = cx;
                            currentY = cy;
                            currentXY = `[{"x":${cx}, "y":${cy}}]`;

                            // Boxes me display karna
                            document.getElementById('out-x').innerText = currentX;
                            document.getElementById('out-y').innerText = currentY;
                            document.getElementById('out-xy').innerText = currentXY;
                        });
                    });
                }
            };
            reader.readAsText(file); // SVG ko locally read karna
        });
    </script>
</body>
</html>
