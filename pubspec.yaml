# --- App Icon Config ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

# --- Splash Screen Config ---
flutter_native_splash:
  color: "#0B0E17" # Premium dark background to match the app theme
  image: assets/images/splash.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/splash.png
    icon_background_color: "#0B0E17"
    color: "#0B0E17"

# --- ASSETS CONFIGURATION ---
flutter:
  uses-material-design: true
  assets:
    - assets/style.json
    - assets/icon/icon.png
    - assets/icon/logo.png
    - assets/images/whatsapp.png
    - assets/images/gpay.png
    - assets/images/phonepe.png
    - assets/images/paytm.png
    - assets/images/upi.png
    - assets/images/metrocard.png
    - assets/images/splash.png
    - assets/images/nav_puck.png
    - assets/images/custom_pin.png
    - assets/images/add_places.png
    - assets/ridel_dark_theme.json
    - .env