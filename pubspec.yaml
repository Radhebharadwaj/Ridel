name: ridel
description: The Ultimate Travel Ecosystem
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- 1. CORE MAP ENGINE ---
  maplibre_gl: any
  flutter_compass: ^0.8.0
  flutter_polyline_points: ^2.0.0

  # --- 2. STATE & BACKEND ---
  provider: ^6.1.1
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.0

  # --- 3. DATABASE & STORAGE ---
  sqflite_sqlcipher: ^3.0.0
  sqflite_common_ffi_web: ^0.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # --- 4. LOCATION & ENVIRONMENT ---
  geolocator: any
  intl: ^0.20.2
  sunrise_sunset_calc: any

  # --- 5. UI, DESIGN & GRAPHICS ---
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  flutter_svg: ^2.2.3
  shimmer: ^3.0.0
  avatar_glow: ^2.0.0
  pointer_interceptor: any
  flutter_native_splash: ^2.4.0

  # --- 6. AUTHENTICATION & SECURITY ---
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_turnstile: ^1.2.0
  pinput: ^6.0.2
  local_auth: ^3.0.0

  # --- 7. NOTIFICATIONS & BACKGROUND ---
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2

  # --- 8. UTILS, SPEECH & MEDIA ---
  http: ^1.6.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  device_info_plus: ^10.1.0
  package_info_plus: ^8.3.0
  speech_to_text: any
  image_picker: ^1.2.1
  share_plus: any
  image: ^4.8.0
  web: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

# --- App Icon Config ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

# --- Splash Screen Config ---
flutter_native_splash:
  color: "#050505"
  image: assets/icon/logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/icon/logo.png
    icon_background_color: "#050505"
    color: "#050505"

# --- ASSETS CONFIGURATION ---
flutter:
  uses-material-design: true
  assets:
    - assets/style.json
    - assets/ridel_dark_theme.json
    - assets/icon/icon.png
    - assets/icon/logo.png
    - assets/images/nav_puck.png
    - assets/images/custom_pin.png
    - assets/images/add_places.png
