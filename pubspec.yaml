name: ridel
description: The Ultimate Travel Ecosystem
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- 9. FIREBASE & NOTIFICATIONS ---
  crypto: ^3.0.7
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.10
  flutter_image_compress: ^2.3.0 # 🪄 Image Magic (WebP conversion) ke liye

  # --- 1. CORE MAP ENGINE ---
  # 🔥 Git override hata diya hai. Hum strict stable version use karenge jo Java 21 nahi mangta.
  maplibre_gl: any   
  flutter_compass: ^0.8.0

  # --- 2. UI & UX ---
  sliding_up_panel: ^2.0.0+1 

  # --- 3. DATABASE ---
  sqflite_sqlcipher: ^3.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Web & Desktop Support
  sqflite_common_ffi: ^2.3.2
  sqflite_common_ffi_web: ^0.4.2
  sqlite3: ^2.1.0

  # --- 4. STATE MANAGEMENT ---
  provider: ^6.1.1

  # --- 5. LOCATION & UTILS ---
  geolocator: ^14.0.2
  share_plus: ^10.1.0
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  intl: ^0.20.2

  # --- 6. ANIMATIONS & DESIGN ---
  google_fonts: ^8.0.0
  cupertino_icons: ^1.0.6
  animated_text_kit: ^4.3.0
  avatar_glow: ^2.0.0
  image_picker: ^1.2.1
  image_cropper: ^11.0.0

  # --- 7. BACKEND ---
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0
  device_info_plus: ^12.4.0
  package_info_plus: ^8.3.0
  flutter_native_splash: any
  shimmer: ^3.0.0
  
  # --- 8. EXTRAS ---
  speech_to_text: ^7.3.0
  collection: ^1.19.1
  sunrise_sunset_calc: any

  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_polyline_points: ^2.0.0
  path_drawing: ^1.0.1
  flutter_svg: ^2.2.3
  pointer_interceptor: any

  flutter_local_notifications: ^21.0.0
  flutter_map: any
  latlong2: any
  flutter_dotenv: ^6.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  image: ^4.8.0
  flutter_turnstile: ^1.2.0
  cached_network_image: ^3.4.1
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  analyzer: any

# 🛑 YAHAN MAINE OVERRIDES KO COMMENT KAR DIYA HAI TAALI STABLE VERSION USE HO
