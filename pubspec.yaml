name: ridel
description: The Ultimate Travel Ecosystem
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- 1. CORE MAP ENGINE ---
  # 🔥 Git override hata diya hai. Hum strict stable version use karenge jo Java 21 nahi mangta.
  maplibre_gl: any   

  # --- 2. UI & UX ---
  sliding_up_panel: ^2.0.0+1 

  # --- 3. DATABASE ---
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Web & Desktop Support
  sqflite_common_ffi: ^2.3.2
  sqflite_common_ffi_web: ^0.4.2
  sqlite3: ^2.1.0

  # --- 4. STATE MANAGEMENT ---
  provider: ^6.1.1

  # --- 5. LOCATION & UTILS ---
  geolocator: ^14.0.2
  share_plus: ^10.1.0
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  intl: ^0.20.2

  # --- 6. ANIMATIONS & DESIGN ---
  google_fonts: ^8.0.0
  cupertino_icons: ^1.0.6
  animated_text_kit: ^4.3.0
  avatar_glow: ^2.0.0
  image_picker: ^1.2.1
  image_cropper: ^11.0.0

  # --- 7. BACKEND ---
  supabase_flutter: ^2.12.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0
  device_info_plus: ^11.0.0
  
  # --- 8. EXTRAS ---
  speech_to_text: ^7.3.0
  collection: ^1.19.1

  http: ^1.6.0
  url_launcher: ^6.2.1
  flutter_polyline_points: ^2.0.0
  pointer_interceptor: ^0.10.1+2
  path_drawing: ^1.0.1
  flutter_svg: ^2.2.3

  flutter_map: ^6.1.0  
  latlong2: ^0.9.0
  flutter_map_cancellable_tile_provider: ^2.0.0

  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dependency_overrides:
  maplibre_gl:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      path: maplibre_gl
      ref: main
  maplibre_gl_web:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      path: maplibre_gl_web
      ref: main

# --- App Icon Config ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

# --- Splash Screen Config ---
flutter_native_splash:
  color: "#000000"
  image: "assets/icon/icon.png"
  android: true
  ios: true

# --- ASSETS CONFIGURATION ---
flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/logo.png
